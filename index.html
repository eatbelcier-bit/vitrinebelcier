<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  video {
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
</style>
</head>
<body>
<video id="v" muted playsinline loop autoplay></video>
<script>
const v = document.getElementById('v');
fetch('video.mp4')
  .then(r => r.blob())
  .then(b => {
    v.src = URL.createObjectURL(b);
    v.play();
  });
</script>
</body>
</html>
